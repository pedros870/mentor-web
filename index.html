<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- La página solo carga su propio código y solo habla con GitHub. -->
  <!-- En Para ver, además: el reproductor de YouTube (sin cookies) y su oEmbed, para el título de un video recién pegado. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https://api.github.com https://www.youtube.com; frame-src https://www.youtube-nocookie.com; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>Mentor</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232944bf'/%3E%3Cg fill='%23fff'%3E%3Crect x='8.5' y='7' width='3.5' height='18' rx='1'/%3E%3Crect x='14.25' y='7' width='3.5' height='18' rx='1'/%3E%3Crect x='20' y='7' width='3.5' height='18' rx='1'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/estilos.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="cabecera">
    <a class="marca" href="#/principal">Mentor</a>
    <nav class="navegacion" aria-label="Secciones">
      <!-- Desde el 21-nov-2026: Principal y Todo lo demás, hechas sin IA. Hoy, Geografía, Áreas, Sectores y
           Seguimiento siguen en sus direcciones, con lo que había hasta el 20 de noviembre. -->
      <a href="#/principal" data-vista="principal">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span>Principal</span>
      </a>
      <a href="#/todo" data-vista="todo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
        <span>Todo</span>
      </a>
      <a href="#/para-leer" data-vista="para-leer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 5h6a4 4 0 0 1 4 4v11a3 3 0 0 0-3-3H2zM22 5h-6a4 4 0 0 0-4 4v11a3 3 0 0 1 3-3h7z"/></svg>
        <span>Para leer</span>
      </a>
      <a href="#/para-ver" data-vista="para-ver">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9.5v5l4.5-2.5z"/></svg>
        <span>Para ver</span>
      </a>
      <a href="#/cuaderno" data-vista="cuaderno">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h11a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6zM6 3v18M10 8h5M10 12h5"/></svg>
        <span>Cuaderno</span>
      </a>
      <a href="#/fuentes" data-vista="fuentes" class="solo-ancho">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11a8 8 0 0 1 8 8M5 4a15 15 0 0 1 15 15"/><circle cx="6" cy="18" r="1.5"/></svg>
        <span>Fuentes</span>
      </a>
      <a href="#/estado" data-vista="estado" class="solo-ancho">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3 7 4-14 3 7h4"/></svg>
        <span>Estado</span>
      </a>
    </nav>
    <!-- En el celular, Fuentes y Estado van arriba para que la barra de abajo no se apriete. -->
    <nav class="atajos" aria-label="Administración">
      <a href="#/fuentes" data-vista="fuentes" aria-label="Fuentes" title="Fuentes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11a8 8 0 0 1 8 8M5 4a15 15 0 0 1 15 15"/><circle cx="6" cy="18" r="1.5"/></svg></a>
      <a href="#/estado" data-vista="estado" aria-label="Estado" title="Estado"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3 7 4-14 3 7h4"/></svg></a>
    </nav>
    <button class="boton-buscar" id="boton-buscar" type="button" aria-label="Buscar (Ctrl+K)" title="Buscar (Ctrl+K o /)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <span class="buscar-texto">Buscar</span><kbd class="buscar-texto">Ctrl K</kbd>
    </button>
    <button class="boton-tema" id="boton-tema" type="button" aria-label="Cambiar entre tema claro, oscuro o automático">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" class="relleno"/></svg>
    </button>
  </header>
  <main id="contenido" tabindex="-1"><p class="cargando">Cargando…</p></main>
  <div id="aviso" class="aviso-flotante" role="status" aria-live="polite" hidden></div>
</body>
</html>
