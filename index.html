<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- La página solo carga su propio código y solo habla con GitHub. -->
  <!-- En Para ver, además: el reproductor de YouTube (sin cookies) y su oEmbed, para el título de un video recién pegado. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https://api.github.com https://www.youtube.com; frame-src https://www.youtube-nocookie.com; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>Mentor</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23a8471f'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='18' text-anchor='middle' fill='%23fff'%3EM%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/estilos.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="cabecera">
    <a class="marca" href="#/hoy">Mentor</a>
    <!-- Cuatro destinos: lo de hoy, todo lo demás por región, área o sector, lo que hay para leer y ver, y lo que se aprende. -->
    <nav class="navegacion" aria-label="Secciones">
      <a href="#/hoy" data-vista="hoy">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span>Hoy</span>
      </a>
      <a href="#/explorar" data-vista="explorar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
        <span>Explorar</span>
      </a>
      <a href="#/biblioteca" data-vista="biblioteca">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 5h6a4 4 0 0 1 4 4v11a3 3 0 0 0-3-3H2zM22 5h-6a4 4 0 0 0-4 4v11a3 3 0 0 1 3-3h7z"/></svg>
        <span>Biblioteca</span>
      </a>
      <a href="#/cuaderno" data-vista="cuaderno">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h11a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6zM6 3v18M10 8h5M10 12h5"/></svg>
        <span>Cuaderno</span>
      </a>
    </nav>
    <button class="boton-buscar" id="boton-buscar" type="button" aria-label="Buscar (Ctrl+K)" title="Buscar (Ctrl+K o /)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <span class="buscar-texto">Buscar</span><kbd class="buscar-texto">Ctrl K</kbd>
    </button>
    <!-- Lo que es del sistema y no de la lectura: el estado, el gasto y las fuentes. -->
    <a class="boton-sistema" href="#/estado" data-vista="sistema" aria-label="Sistema: estado, gasto y fuentes" title="Sistema: estado, gasto y fuentes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3 7 4-14 3 7h4"/></svg>
    </a>
    <button class="boton-tema" id="boton-tema" type="button" aria-label="Cambiar entre tema claro, oscuro o automático">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" class="relleno"/></svg>
    </button>
  </header>
  <main id="contenido" tabindex="-1"><p class="cargando">Cargando…</p></main>
  <div id="aviso" class="aviso-flotante" role="status" aria-live="polite" hidden></div>
</body>
</html>
